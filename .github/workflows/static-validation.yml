name: static-validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify source manifest
        run: python -B scripts/verify_kit.py
      - name: Run reusable source audit
        run: python -B skills/fpga-ml-reproducibility-audit/scripts/audit_fpga_repro.py --root . --contract reproducibility-contract.json --mode source
      - name: Test publication safety
        run: python -B -m unittest discover -s scripts/tests -v
      - name: Test generic PYNQ Skill offline
        run: |
          python -m pip install numpy==1.24.4
          python -B -m unittest discover -s skill/pynq-overlay-validation/tests -v
      - name: Compile Python sources
        run: python -m compileall -q 02_Model_Pipeline 03_Package_Builder 04_PC_App/template 05_PYNQ_Board/template 06_Power_Measurement scripts skill skills
